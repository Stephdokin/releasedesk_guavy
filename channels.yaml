# Guavynator pacing and constraints.
#
# One account per platform, so a channel key is just the platform name. The
# band's desk needs `instagram` and `instagram_sk` to tell two accounts apart;
# here there is only one of each and the suffixes would be noise.
#
# per_week is a ceiling, not a target, and the allocator can only place as many
# posts as there are days in `days`. Raising one without the other does nothing.
#
# Everything here is inherited from the band's desk and is a guess for Guavy.
# A product does not post like a band. Set these deliberately.
timezone: America/Edmonton
# `prefer_shape` is which crop this channel is sent when a post carries more
# than one. Instagram wants the vertical one, LinkedIn the wide one, and
# sending both put two copies of the same story in one post. It is a
# preference, not a filter: a post whose only picture is a vertical short goes
# out vertical on LinkedIn too, because the alternative is no picture.
channels:
  linkedin:
    prefer_shape: landscape
    label: LinkedIn
    per_week: 3
    accepts:
    - video_16x9
    - video_9x16
    - image
    - text
    days:
    - Mon
    - Tue
    - Thu
    time: 08:00
    strict_duplicates: true
    links_in_first_comment: true
    notes: 'TODO: confirm this account exists and is connected.'
  instagram:
    prefer_shape: portrait
    label: Instagram
    per_week: 4
    accepts:
    - video_9x16
    - image
    days:
    - Mon
    - Wed
    - Fri
    - Sat
    time: '11:00'
    mirrors: facebook
    notes: 'TODO: confirm this account exists and is connected.'
  facebook:
    prefer_shape: landscape
    label: Facebook
    per_week: 4
    accepts:
    - video_9x16
    - video_16x9
    - image
    days:
    - Mon
    - Wed
    - Fri
    - Sat
    time: '11:00'
    notes: 'TODO: confirm this account exists and is connected.'
  youtube:
    prefer_shape: landscape
    label: YouTube
    per_week: 3
    accepts:
    - video_16x9
    - video_9x16
    days:
    - Tue
    - Fri
    - Sun
    time: '10:00'
    notes: 'TODO: confirm this account exists and is connected.'
  tiktok:
    prefer_shape: portrait
    label: TikTok
    per_week: 5
    accepts:
    - video_9x16
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Sat
    time: '18:00'
    notes: 'TODO: confirm this account exists and is connected.'
  x:
    prefer_shape: landscape
    label: X
    zernio_platform: twitter
    per_week: 7
    accepts:
    - video_9x16
    - video_16x9
    - image
    - text
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    time: 09:00
    max_chars: 280
    notes: 'TODO: confirm this account exists and is connected.'
