# Guavynator pacing and constraints.
#
# One account per platform, so a channel key is just the platform name.
#
# When a post's timing is left on Auto, the desk puts it on the channel's next
# day in `days`, at `time`, skipping `blackouts`.
#
# The days and times here are inherited, not chosen. Set them deliberately.
timezone: America/Edmonton
# `prefer_shape` is which crop this channel is sent when a post carries more
# than one. Instagram wants the vertical one, LinkedIn the wide one, and
# sending both put two copies of the same story in one post. It is a
# preference, not a filter: a post whose only picture is a vertical short goes
# out vertical on LinkedIn too, because the alternative is no picture.
channels:
  linkedin:
    prefer_shape: landscape
    label: LinkedIn
    accepts:
    - video_16x9
    - video_9x16
    - image
    - text
    days:
    - Mon
    - Tue
    - Thu
    time: 08:00
    strict_duplicates: true
    # No links at all, 5 Oct 2026. LinkedIn holds back posts that send people
    # off the site, and the link we put in the first comment counted as one,
    # besides inflating our own comment numbers. The graphic still prints
    # guavy.com/wire for anyone who wants it.
    drop_links: true
    notes: Connected in Zernio, 23 Sep 2026.
  instagram:
    prefer_shape: portrait
    label: Instagram
    accepts:
    - video_9x16
    - image
    days:
    - Mon
    - Wed
    - Fri
    - Sat
    time: '11:00'
    mirrors: facebook
    notes: Connected in Zernio, 23 Sep 2026.
  facebook:
    prefer_shape: landscape
    label: Facebook
    accepts:
    - video_9x16
    - video_16x9
    - image
    days:
    - Mon
    - Wed
    - Fri
    - Sat
    time: '11:00'
    notes: Not connected yet. Connected last, once the post flow is proven.
  youtube:
    prefer_shape: landscape
    label: YouTube
    accepts:
    - video_16x9
    - video_9x16
    days:
    - Tue
    - Fri
    - Sun
    time: '10:00'
    notes: Connected in Zernio, 3 Oct 2026.
  tiktok:
    prefer_shape: portrait
    label: TikTok
    # Captions on TikTok carry no clickable links, so none are sent. Pictures
    # go as a photo post: see tiktok_fields() in push_zernio.py.
    drop_links: true
    accepts:
    - video_9x16
    - image
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    time: '18:00'
    notes: Connected in Zernio, 5 Oct 2026 (@guavysentiment3).
  x:
    prefer_shape: portrait     # same 9:16 as Instagram, 3 Oct 2026. X crops tall
                               # images in the timeline; the corner text sits
                               # inside the middle 4:5, so it survives.
    # No links, 5 Oct 2026. X charges $0.20 to post anything carrying a link
    # and $0.015 without. The graphic prints guavy.com/wire.
    drop_links: true
    label: X
    zernio_platform: twitter
    accepts:
    - video_9x16
    - video_16x9
    - image
    - text
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    time: 09:00
    max_chars: 280
    notes: Connected in Zernio, 3 Oct 2026.
  # @GuavyForex, an X account of its own that carries FX stories only. Same
  # graphic, same no-link rule as @GuavySentiment. Connected 5 Oct 2026.
  x_forex:
    platform: x
    zernio_platform: twitter
    label: X Forex
    prefer_shape: portrait
    drop_links: true
    accepts:
    - image
    - text
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    time: 09:00
    max_chars: 280
    notes: Connected in Zernio, 5 Oct 2026. FX only.
platforms:
  linkedin:
    label: LinkedIn
    ink: '#4C9AC4'
    collab: false
    tag: true
    max_chars: 3000
  x:
    label: X
    ink: '#BFC4BA'
    collab: false
    tag: true
    aliases:
    - twitter
    max_chars: 280
  instagram:
    label: Instagram
    ink: '#D2708F'
    collab: true
    tag: true
    max_chars: 2200
  facebook:
    label: Facebook
    ink: '#8A7FD1'
    collab: false
    tag: true
    max_chars: 63206
  youtube:
    label: YouTube
    ink: '#CB5540'
    collab: false
    tag: true
    max_chars: 5000
  tiktok:
    label: TikTok
    ink: '#4FC2A8'
    collab: false
    tag: true
    max_chars: 2200
# ---------------------------------------------------------------- Markets
#
# The Markets tab posts the most important thing Guavy has seen since that
# channel last heard from it. Its pacing is separate from the posting days
# above: a campaign post is planned, a markets post is a reaction to news, and
# the two compete for the same attention but not for the same slots.
#
# These are per market, not a pool. Every market gets the same allowance on a
# channel, because there is no reason to promote crypto over commodities, and
# each keeps its own timer. So `per_day: 1` on linkedin means one crypto post,
# one equities post, one FX post and one commodities post: four a day on that
# account, which is what the All tab totals up.
#
# `min_hours` is the floor between two posts from the same market on that
# channel. `per_day` is that market's ceiling for a busy news day. `min_clout`
# is how interesting a brief has to be to be worth posting at all: the Guavy
# API scores every brief 0-100, and most of them are not news.
markets:
  quiet_hours: [23, 7]        # local, inclusive start, exclusive end

  # What makes a story worth posting. Clout on its own does not sort: over a
  # full sweep of all four markets it ran 20 to 100 with a median of 82, so
  # almost everything is loud. Sentiment separates. It runs about -4 to +4 and
  # the sign does not matter: a strongly negative story moves the needle as
  # much as a strongly positive one, and neutral is what to skip.
  #
  # A floor of 2 barely filters, keeping 151 of 159 briefs on that sweep. A
  # floor of 3 keeps 76, which is the half worth looking at.
  # How far back to look for a candidate. Not "since we last posted": a story
  # is skipped because it has already gone out, which the desk knows from the
  # article id on the post, so there is no reason to ignore everything that
  # arrived before the last one.
  window_hours: 24
  min_sentiment: 3.0
  rank:
    sentiment: 0.6            # weight on distance from neutral
    clout: 0.4                # weight on how loud it is
  # min_hours is per market. The channel also waits between any two market
  # posts, so the four do not land together: spread_hours, or by default
  # min_hours shared across the four markets (10h -> one every 2.5h).
  channels:
    linkedin:
      min_hours: 10           # once a day at most. More is suppressed there.
      per_day: 2
      min_clout: 60
    instagram:
      min_hours: 9
      per_day: 2
      min_clout: 60
    x:
      # 24 a day, one about every 40 minutes over the 16 hours outside quiet
      # hours (set 3 Oct 2026). Half of them crypto (5 Oct 2026): 12 crypto,
      # 4 each for the other three. The next slot goes to whichever market is
      # furthest behind its share, so crypto alternates with the others
      # rather than bunching; per_day sets the shares. Simulated over a day:
      # 24 posts, 12 crypto, never more than two crypto in a row.
      min_hours: 2
      per_day: 4
      spread_hours: 0.65
      min_clout: 35
      markets:
        crypto:
          min_hours: 0.65
          per_day: 12
    tiktok:
      # Started small, 5 Oct 2026: one a day per market, four in all, about
      # four hours apart. A new account, and TikTok moderates API posts more
      # strictly than the app. Zernio allows 15 photo posts a day.
      min_hours: 12
      per_day: 1
      spread_hours: 4
      min_clout: 60
    x_forex:
      # @GuavyForex: FX only, about half the rate of the X Wire stream (12 a
      # day against 24), one every 80 minutes or so outside quiet hours. Set
      # 5 Oct 2026. A dedicated feed would run out of FX tickers under the
      # 24-hour any-account rule, so here a ticker waits ticker_hours and
      # only against this account's own posts; an article still goes out
      # once anywhere.
      only: [forex]
      min_hours: 1.3
      per_day: 12
      spread_hours: 1.3
      min_clout: 35
      ticker_hours: 6
      ticker_scope: channel
    facebook:
      min_hours: 7
      per_day: 3
      min_clout: 55
    youtube:
      # In the table, not posting: YouTube takes video only, and the desk
      # does not make Shorts yet. Delete `paused` once it does. The numbers
      # are a placeholder, one a day per market, to be set then.
      paused: needs video, Shorts not built yet
      min_hours: 12
      per_day: 1
      min_clout: 60
    # tiktok is absent. A channel with no entry here never posts from Markets.

phases:
  tease:
    from: -1
    to: -1
    weight: 1
  launch:
    from: 0
    to: 0
    weight: 5
  peak:
    from: 1
    to: 3
    weight: 3
  taper:
    from: 4
    to: 9
    weight: 1
blackouts:
- 2026-09-07
- 2026-12-24
- 2026-12-25
- 2026-12-26
- 2026-12-31
- 2027-01-01

# ---------------------------------------------------------------- Ads
#
# Ads post the picture and the words on it, with the ad's own tracked link
# (on LinkedIn the link goes in the first comment, which ads keep even though
# Wire posts there carry no link). Set 5 Oct 2026: 8 a day on X, 4 on the
# others, spaced evenly across the hours outside quiet hours unless a channel
# sets min_hours. The ad that has gone longest without running on a channel
# goes next, and none repeats on a channel within repeat_days. An ad keeps
# clear_minutes from any Wire post on the same account.
ads:
  repeat_days: 3
  clear_minutes: 15
  # size is the default picture size per channel (5 Oct 2026: square for X
  # and LinkedIn, 4:5 for Instagram). The Ads tab can change it; an ad not
  # made in the chosen size posts the size nearest it in shape.
  channels:
    x:
      size: 1080x1080
      per_day: 8
      # No link on X ads (5 Oct 2026): $0.20 a post with one. The ad's
      # picture carries the call to action and guavy.com. Other channels
      # keep the tracked link, where it costs nothing.
      links: none
    linkedin:
      size: 1080x1080
      per_day: 4
    instagram:
      size: 1080x1350
      per_day: 4
    facebook:
      size: 1080x1350
      per_day: 4              # not connected yet; waits until it is
    tiktok:
      # 9:16, the shape TikTok fills the screen with. No link: captions
      # there are not clickable. Ads are marked as Guavy's own brand.
      size: 1080x1920
      per_day: 2
      links: none
    youtube:
      # In the table, not posting, until the desk makes video ads. Delete
      # `paused` then. The number is a placeholder.
      paused: needs video, Shorts not built yet
      size: 1080x1920
      per_day: 2
