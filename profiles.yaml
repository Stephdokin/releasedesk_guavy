      accounts:
        linkedin: 69fc279192b3d8e85f87edef
        instagram: 69fc283392b3d8e85f87f1b8
        x: 6ac199578a109a539bdd5db6           # @GuavySentiment
        x_forex: 6ac45ca1674a7205590d1ae1     # @GuavyForex, FX only (5 Oct 2026)
        tiktok: 6ac45e96d853e39e68f08d74      # @guavysentiment3 (5 Oct 2026)
        youtube: 6ac19abfeae25a4a7ee467e4     # guavysentiment
