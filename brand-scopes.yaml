# Brand scopes: how each instrument should look when Gemini draws it.
#
# Ported from COIN_VISUALS in the first Guavynator, at
# ~/Documents/1 Guavy/Guavynator/guavynator/app.py, and extended to the three
# markets that desk never covered.
#
# Six crypto entries were rewritten on the way across. The originals leaned on
# "rising", "surge", "rally", "moon" and "digital gold bars stacking in
# infinite supply", which the current claims rules will not carry: a picture
# may not imply a market going up, and heaps of treasure are out. Each now
# describes the asset itself rather than what anyone might make from it.
#
#   name    what it is called in the copy
#   colour  its palette, which overrides the house teal for the subject
#   mark    its published symbol, when it has one
#   visual  the scene to draw. Concrete nouns, no motion words, no outcome.
#
# A symbol with no entry falls back to the house style alone, which is safe
# but generic. Add one rather than letting that happen twice.
